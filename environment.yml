# Tools needed to run `AAFTF pipeline` with its default settings (same as the pixi
# "default" environment in pyproject.toml). For the optional steps and options too,
# use environment.dev.yml.
name: aaftf
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10,<3.15
  - bbmap>=39.80,<40        # bbduk.sh, shuffle.sh, reformat.sh (brings java)
  - spades
  - blast
  - sourmash
  - bwa
  - samtools>=1.24,<2
  - minimap2
  - biopython>=1.88
  - psutil>=5
  - matplotlib-base>=3
  - packaging
  - pip
  - pip:
    - aaftf
