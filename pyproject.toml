[project]
name = "AAFTF"
dynamic = ["version"]
authors = [
    { name = "Jason Stajich", email = "jasonstajich.phd@gmail.com" },
    { name = "Jonathan Palmer", email = "nextgen.usfs@gmail.com" },
]
maintainers = [
    { name = "Jason Stajich", email = "jasonstajich.phd@gmail.com" },
    { name = "Cheng-Hung Tsai", email = "chenghung.tsai@email.ucr.edu" },
]
description = "Automatic Assembly For The Fungi - for automating genome assembly focused on short reads with cleanup, vector trimming and contam detection, resorting contigs by size and renaming, and summary statistics including telomere detection"
readme = "README.md"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "biopython>=1.88",
    "matplotlib>=3",
    "packaging",
    "psutil>=5",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/stajichlab/AAFTF"
Issues = "https://github.com/stajichlab/AAFTF/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.scripts]
AAFTF = "aaftf.main:main"

# Version is derived from git tags (vX.Y.Z) plus the short commit hash.
# At runtime, aaftf/__init__.py resolves __version__ via importlib.metadata
# from the installed package's metadata.
[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "guess-next-dev", local_scheme = "node-and-date", fallback_version = "0.0.0+unknown" }

[tool.hatch.build.targets.wheel]
packages = ["aaftf", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: pure Python tests, no external tools required",
    "integration: requires external bioinformatics tools (minimap2, samtools, mosdepth, etc.)",
]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.15"

# ---------------------------------------------------------------------------
# Conda toolchain shared by every environment. Kept in an explicit "common"
# feature (rather than the top-level/implicit default feature) so it can be
# combined with either pypi source below without pixi's always-on default
# feature dragging in both aaftf sources into the same solve at once.
# ---------------------------------------------------------------------------
[tool.pixi.feature.common.dependencies]
samtools = ">=1.24,<2"
taxonkit = "*"
bwa = "*"
minimap2 = "*"
freebayes = "*"
yak = "*"
blast = "*"
diamond = "*"
sourmash = "*"
trimmomatic = "*"
spades = "*"
fastp = "*"
novoplasty = "*"
megahit = "*"
unicycler = "*"
fastqc = "*"
flye = "*"
pypolca = ">=0.5.0,<0.6"
polypolish = ">=0.7.1,<0.8"
nextpolish2 = ">=0.2.2,<0.3"
racon = "*"
hifiasm = "*"
kraken2 = "*"
gfatools = "*"
ncbi-fcs-gx = "*"
mosdepth = ">=0.3.10"
bbmap = ">=39.80,<40"

[tool.pixi.feature.dev.pypi-dependencies]
aaftf = { path = ".", editable = true, extras = ["dev"] }

# ---------------------------------------------------------------------------
# "release" environment — installs AAFTF from PyPI/GitHub.
# Used by:  pixi install --environment release
#            docker build --build-arg PIXI_ENV=release ...
#
# Release workflow:
#   1. git tag v0.X.Y && git push origin v0.X.Y
#   2. Update this file: change branch="main" to tag="v0.X.Y"
#   3. pixi install --environment release  (regenerates pixi.lock)
#   4. git add pixi.lock && git commit -m "Bump aaftf to v0.X.Y" && git push
#
# Until step 2 is done, this tracks the main branch (development builds).
# ---------------------------------------------------------------------------
[tool.pixi.feature.release.pypi-dependencies]
aaftf = { git = "https://github.com/stajichlab/AAFTF", branch = "main" }

[tool.pixi.tasks]
# Build bowtie2 from source into the active env to fix AVX2 (x86-64-v3)
# runtime fallback in the conda binary. Run once after `pixi install`:
#   pixi run install-bowtie2
# Mirrors the approach used in funannotate.
install-bowtie2 = { cmd = "bash install_scripts/pixi_install_bowtie2.sh", description = "Build bowtie2 from source to fix AVX2 runtime fallback issues" }

[tool.pixi.environments]
default = { features = ["common", "dev"] }
release = { features = ["common", "release"] }
